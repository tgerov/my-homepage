{{ define "title" }}{{ .Title }} — {{ .Site.Title }}{{ end }}

{{ define "main" }}
<section class="list-page">
  <p class="section-heading">{{ .Title | lower }}</p>
  {{ range .Pages.GroupByDate "2006" }}
  <h2 class="post-year">{{ .Key }}</h2>
  <ul class="post-list">
    {{ range .Pages }}
    <li class="post-list-item">
      <a href="{{ .RelPermalink }}">
        <span class="post-title">{{ .Title }}</span>
        {{ with .Date }}<span class="prose-date">{{ .Format "Jan 2" }}</span>{{ end }}
      </a>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</section>
{{ end }}
